<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<title>Animator Schedule Board MVP</title>

<style>
  :root{
    --bg:#eef2f6;
    --bg2:#e4e9ef;
    --panel:#ffffff;
    --panel-soft:#f8fafc;
    --grid:#d7dde5;
    --grid-strong:#8c95a2;
    --grid-dark:#202020;
    --head:#565d68;
    --head2:#464d57;
    --head-text:#f8fafc;
    --green:#cfeecf;
    --green-deep:#1d7a41;
    --pink:#ffd0d8;
    --pink-deep:#b32543;
    --yellow:#fff2b8;
    --yellow-deep:#8a6a00;
    --orange:#ffe3bd;
    --orange-deep:#d96a0c;
    --text:#111827;
    --muted:#667085;
    --accent:#14833b;
    --danger:#b42318;
    --shadow:0 10px 28px rgba(15, 23, 42, .08);
    --radius:16px;
    --header1:22px;
    --header2:22px;
    --progressTop:56px;
    --sheetMin:720px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Noto Sans JP", sans-serif;
    background:
      radial-gradient(circle at top left, rgba(255,255,255,.85), rgba(255,255,255,0) 28%),
      linear-gradient(180deg, var(--bg), var(--bg2));
    color:var(--text);
    overflow:hidden;
  }
  .app{
    height:100vh;
    display:grid;
    grid-template-rows:auto auto auto auto auto minmax(0,1fr);
    gap:8px;
    padding:10px;
    overflow:hidden;
  }
  .topbar{
    display:flex;
    gap:16px;
    align-items:flex-start;
    justify-content:space-between;
    padding:12px 16px;
    background:linear-gradient(180deg, #313740 0%, #232931 100%);
    color:#fff;
    border:1px solid rgba(255,255,255,.08);
    border-radius:16px;
    box-shadow:var(--shadow);
  }
  .brand{
    display:grid;
    gap:4px;
  }
  .brand h1{
    font-size:22px;
    line-height:1.15;
    margin:0;
    font-weight:900;
    letter-spacing:.02em;
  }
  .brand .subtitle{
    font-size:14px;
    color:rgba(255,255,255,.72);
    letter-spacing:.04em;
  }
  .topbar .right{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:flex-end;
  }
  button, input, select{
    font:inherit;
  }
  button{
    border:1px solid #cad3df;
    background:linear-gradient(180deg, #ffffff 0%, #f5f7fa 100%);
    color:#182230;
    border-radius:10px;
    padding:8px 12px;
    cursor:pointer;
    font-weight:800;
    box-shadow:0 1px 0 rgba(255,255,255,.9) inset;
    transition:.15s ease;
  }
  button:hover{
    transform:translateY(-1px);
    box-shadow:0 6px 16px rgba(15,23,42,.08);
  }
  button.primary{
    background:linear-gradient(180deg, #1fa55d 0%, #16864a 100%);
    color:#fff;
    border-color:#0e6d3a;
  }
  button.danger{
    background:linear-gradient(180deg, #fff7f8 0%, #ffeef1 100%);
    color:#9f1239;
    border-color:#e2a6b5;
  }
  button:active{transform:translateY(1px)}

  .language-picker{
    display:flex;
    align-items:center;
    gap:6px;
    padding:4px 8px;
    border:1px solid #d9e1ea;
    border-radius:999px;
    background:#fff;
    font-size:12px;
    font-weight:900;
    color:#475467;
  }
  .language-picker select{
    min-width:96px;
    padding:6px 8px;
    border:1px solid #c6d0db;
    border-radius:999px;
    background:#fff;
    font-weight:900;
  }
  .summary{
    display:none;
  }
  .card{
    background:linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    border:1px solid #d9e1ea;
    border-radius:10px;
    padding:7px 10px;
    min-height:48px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    left:0; top:0;
    width:100%;
    height:4px;
    background:linear-gradient(90deg, #6b7280, #cbd5e1);
  }
  .card:nth-child(3)::before,
  .card:nth-child(4)::before,
  .card:nth-child(5)::before,
  .card:nth-child(6)::before{
    background:linear-gradient(90deg, #1e9d55, #8ce6ae);
  }
  .card .label{
    font-size:12px;
    color:#667085;
    font-weight:800;
  }
  .card .value{
    font-size:24px;
    font-weight:900;
    margin-top:4px;
    letter-spacing:.01em;
  }
  .toolbar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
    padding:8px 10px;
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(8px);
    border:1px solid #d9e1ea;
    border-radius:14px;
    box-shadow:var(--shadow);
    min-width:0;
  }
  .toolbar label{
    font-size:14px;
    font-weight:900;
    color:#475467;
    display:flex;
    gap:6px;
    align-items:center;
  }
  .toolbar input,
  .toolbar select{
    width:118px;
    border:1px solid #c6d0db;
    border-radius:8px;
    padding:6px 8px;
    background:#fff;
    color:#111827;
  }
  .toolbar select{
    width:150px;
    font-weight:800;
  }
  .toolbar input.small{width:84px}
  .toolbar input.tiny{width:64px}
  #loDeadlineDate,#gengaDeadlineDate{width:138px}
  .toolbar .spacer{flex:1}
  .hint{
    font-size:13px;
    color:#667085;
    background:#f5f8fb;
    border:1px dashed #d0d8e4;
    padding:5px 8px;
    border-radius:999px;
    white-space:nowrap;
  }

  .control-panel{
    display:grid;
    grid-template-columns:1.15fr 1.35fr .7fr;
    gap:8px;
    min-width:0;
  }
  .control-group{
    display:flex;
    align-items:center;
    gap:7px;
    flex-wrap:wrap;
    padding:8px 10px;
    background:linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    border:1px solid #d9e1ea;
    border-radius:14px;
    box-shadow:var(--shadow);
    min-width:0;
  }
  .control-title{
    font-size:13px;
    font-weight:950;
    color:#475467;
    letter-spacing:.08em;
    padding:4px 8px;
    border-radius:999px;
    background:#eef2f7;
    white-space:nowrap;
  }
  .control-group label{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:14px;
    font-weight:900;
    color:#475467;
    white-space:nowrap;
  }
  .control-group input{
    border:1px solid #c6d0db;
    border-radius:8px;
    padding:6px 8px;
    background:#fff;
    color:#111827;
  }
  .control-group input.tiny{width:64px}
  .danger-zone{
    justify-content:flex-end;
  }
  .wrap{
    padding:0;
    overflow:auto;
    min-height:0;
    background:#fff;
    border:1px solid #d9e1ea;
    border-radius:16px;
    box-shadow:var(--shadow);
    overscroll-behavior:contain;
  }
  table{
    border-collapse:separate;
    border-spacing:0;
    min-width:var(--sheetMin);
    width:100%;
    table-layout:fixed;
    background:white;
    margin-top:0;
  }
  th, td{
    border-right:1px solid var(--grid);
    border-bottom:1px solid var(--grid);
    height:30px;
    padding:3px 6px;
    text-align:center;
    vertical-align:middle;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    font-size:14px;
  }
  thead th{
    background:var(--head);
    color:var(--head-text);
    font-weight:900;
    position:sticky;
    top:0;
    z-index:20;
    border-right:1px solid #757e89;
    border-bottom:1px solid #31363e;
    box-shadow:0 1px 0 rgba(255,255,255,.08) inset;
  }
  thead tr:first-child th{
    top:0;
    height:28px;
    font-size:14px;
    letter-spacing:.02em;
  }
  thead tr:nth-child(2) th{
    background:var(--head2);
    top:28px;
    z-index:21;
    height:28px;
  }
  tbody tr:nth-child(even){background:#fbfcfe}
  tbody tr:hover td{background:#f4f9f5}
  .group{
    border-left:2px solid #1f2937!important;
    border-right:2px solid #1f2937!important;
  }
  .thick-left{
    border-left:2px solid #1f2937!important;
  }
  .thick-right{
    border-right:2px solid #1f2937!important;
  }
  .project-cell, .episode-cell{
    font-weight:900;
    background:linear-gradient(180deg, #ffffff 0%, #f6f7f9 100%)!important;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
  }
  .project-cell{
    font-size:22px;
    letter-spacing:.02em;
  }
  .episode-cell{
    font-size:22px;
  }
  .cut-cell, .time-cell{
    text-align:left;
    padding-left:6px;
    font-weight:700;
    cursor:text;
  }
  [contenteditable="true"]:focus{
    outline:2px solid rgba(34,197,94,.55);
    outline-offset:-2px;
    background:#fffef4;
  }
  .time-cell{font-variant-numeric:tabular-nums}
  .work-cell{
    cursor:pointer;
    position:relative;
    background:#fff;
    text-align:center;
    font-weight:950;
    vertical-align:middle;
  }
  .work-cell::before{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    line-height:1;
  }
  .work-cell.state-done::before{
    content:"○";
    color:#2563eb;
    font-size:20px;
    font-weight:950;
  }
  .work-cell.state-progress::before{
    content:"▲";
    color:#d97706;
    font-size:17px;
    font-weight:950;
  }
  .work-cell.state-nigen::before{
    content:"二原";
    color:#fff;
    background:#111827;
    border-radius:5px;
    padding:3px 4px;
    font-size:11px;
    font-weight:950;
    letter-spacing:-.08em;
  }
  .work-cell.check-done::before{
    content:"○";
    color:#d97706;
    font-size:18px;
    font-weight:950;
  }

  tr.row-stage-lo td:not(.project-cell):not(.episode-cell){
    background:#e9f8ee!important;
  }
  tr.row-stage-check td:not(.project-cell):not(.episode-cell),
  tr.row-stage-progress td:not(.project-cell):not(.episode-cell){
    background:#fff7cc!important;
  }
  tr.row-stage-genga td:not(.project-cell):not(.episode-cell){
    background:#eceff3!important;
    color:#6b7280;
  }
  tr.row-stage-genga td.cut-cell,
  tr.row-stage-genga td.time-cell,
  tr.row-stage-genga td.work-cell,
  tr.row-stage-nigen td.cut-cell,
  tr.row-stage-nigen td.time-cell,
  tr.row-stage-nigen td.work-cell{
    opacity:.62;
  }
  tr.row-stage-genga td.selected-cell,
  tr.row-stage-nigen td.selected-cell{
    opacity:1;
  }
  tr.row-stage-nigen td:not(.project-cell):not(.episode-cell){
    background:#eceff3!important;
    color:#6b7280;
  }
  .project-cell, .episode-cell{
    cursor:pointer;
    user-select:none;
  }
  .project-cell::after,
  .episode-cell::after{
    content:"";
  }
  .progress-cell{
    font-weight:900;
    font-variant-numeric:tabular-nums;
  }
  .progress-cell.ok{
    background:var(--green)!important;
    color:var(--green-deep);
  }
  .progress-cell.warn{
    background:var(--pink)!important;
    color:var(--pink-deep);
  }
  .progress-cell.mid{
    background:var(--yellow)!important;
    color:var(--yellow-deep);
  }
  .progress-summary-row td{
    position:sticky;
    top:var(--progressTop);
    z-index:15;
    background:#fff;
    font-weight:900;
    box-shadow:0 6px 14px rgba(15,23,42,.06);
  }
  .alert-cell{
    background:var(--orange);
    color:var(--orange-deep);
    font-weight:900;
  }
  .row-selected td{
    background:inherit;
  }
  td.selected-cell{
    background:#ecfdf3!important;
    outline:2px solid #16a34a;
    outline-offset:-2px;
    position:relative;
    z-index:18;
  }
  td.selected-range{
    background:#e7f7ee!important;
    box-shadow:inset 0 0 0 1px rgba(22,163,74,.42);
  }
  td.selected-range.range-edge-top{border-top:2px solid #16a34a!important}
  td.selected-range.range-edge-bottom{border-bottom:2px solid #16a34a!important}
  td.selected-range.range-edge-left{border-left:2px solid #16a34a!important}
  td.selected-range.range-edge-right{border-right:2px solid #16a34a!important}
  .freeze-project.selected-cell,
  .freeze-episode.selected-cell,
  .freeze-cut.selected-cell,
  .freeze-time.selected-cell{
    background:#ecfdf3!important;
  }
  td[contenteditable="true"]{
    background:transparent;
    cursor:text;
  }
  td[contenteditable="true"]:focus{
    outline:2px solid #16a34a;
    outline-offset:-2px;
    background:#fffef0!important;
  }


  .project-stack{
    display:grid;
    gap:10px;
    min-height:0;
  }

  .left-table-zone{
    position:relative;
    overflow:auto;
    background:#f8fafc;
  }
  .fixed-sheet-head{
    position:sticky;
    top:0;
    z-index:80;
    background:#fff;
    box-shadow:0 2px 8px rgba(15,23,42,.12);
  }
  .fixed-sheet-head table{
    margin:0;
    min-width:var(--sheetMin);
    width:100%;
    table-layout:fixed;
  }
  .sheet-body{
    padding:0;
    min-width:var(--sheetMin);
  }

  .work-group{
    border-top:1px solid #cfd8e3;
    border-bottom:1px solid #cfd8e3;
    border-left:0;
    border-right:0;
    border-radius:12px;
    overflow:hidden;
    background:#f8fafc;
    box-shadow:0 6px 16px rgba(15,23,42,.05);
  }
  .work-group-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:8px 12px;
    background:linear-gradient(180deg,#3f4650 0%,#2f3640 100%);
    color:#fff;
    font-weight:950;
    cursor:grab;
  }
  .work-group-head:active{
    cursor:grabbing;
  }
  .work-group-head strong{
    font-size:16px;
    letter-spacing:.03em;
  }
  .work-group-head span{
    font-size:13px;
    opacity:.82;
    font-weight:850;
  }

  .work-group-head-main{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
  }
  .collapse-toggle,
  .episode-collapse-toggle{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:26px;
    height:26px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,.28);
    background:rgba(255,255,255,.12);
    color:inherit;
    box-shadow:none;
    padding:0;
    font-size:15px;
    line-height:1;
    font-weight:950;
    cursor:pointer;
    flex:0 0 auto;
  }
  .collapse-toggle:hover{
    background:rgba(255,255,255,.22);
  }
  .episode-cell-content{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    min-width:0;
  }

  .episode-info{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    min-width:0;
  }
  .episode-total-time{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    max-width:100%;
    padding:3px 6px;
    border-radius:999px;
    background:#eef2f7;
    color:#334155;
    border:1px solid #cbd5e1;
    font-size:11px;
    font-weight:950;
    line-height:1.15;
    white-space:nowrap;
  }
  .collapsed-episode-row .episode-total-time{
    background:#fff;
  }
  .episode-collapse-toggle{
    width:24px;
    height:24px;
    border-color:#cbd5e1;
    background:#f8fafc;
    color:#334155;
    font-size:13px;
  }
  .episode-collapse-toggle:hover{
    background:#eaf0f7;
  }
  .work-group.collapsed{
    background:#edf2f7;
  }

  .drag-handle{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:24px;
    height:26px;
    border-radius:8px;
    background:rgba(255,255,255,.10);
    color:rgba(255,255,255,.86);
    font-size:16px;
    font-weight:950;
    cursor:grab;
    flex:0 0 auto;
  }
  .work-group.dragging{
    opacity:.45;
    transform:scale(.998);
  }
  .work-group.drop-before{
    box-shadow:0 -5px 0 #2563eb, 0 10px 22px rgba(37,99,235,.18);
  }
  .work-group.drop-after{
    box-shadow:0 5px 0 #2563eb, 0 10px 22px rgba(37,99,235,.18);
  }
  .collapsed-episode-row .empty-row{
    padding:18px!important;
    background:#f8fafc!important;
    color:#667085;
    font-size:14px;
    letter-spacing:.02em;
  }
  .work-group-body{
    display:grid;
    gap:8px;
    padding:8px;
  }

  .work-table-wrap{
    padding:0;
    background:#f8fafc;
  }
  .work-table-wrap table{
    min-width:var(--sheetMin);
    width:100%;
    table-layout:fixed;
    margin:0;
    background:#fff;
    border-left:0;
    border-right:0;
    border-top:0;
    border-bottom:0;
  }

  .work-table-wrap td,
  .work-table-wrap th{
    box-sizing:border-box;
  }
  .work-table-wrap .freeze-project,
  .work-table-wrap .freeze-episode,
  .work-table-wrap .freeze-cut,
  .work-table-wrap .freeze-time{
    position:static!important;
    left:auto!important;
    z-index:auto!important;
  }
  .work-table-wrap td.selected-cell{
    position:relative;
    z-index:2;
  }
  .work-table-wrap td[contenteditable="true"]{
    caret-color:#111827;
    min-width:0;
  }
  .work-row-active td{
    box-shadow:inset 0 0 0 999px rgba(22,163,74,.05);
  }
  tr.episode-start td{
    border-top:2px solid #aeb8c5;
  }
  tr.episode-start:first-child td{
    border-top:0;
  }
  .episode-cell{
    cursor:pointer;
  }
  .episode-cell::after{
    content:"";
  }


  .project-block{
    border:1px solid #d9e1ea;
    border-radius:12px;
    overflow:hidden;
    background:#fff;
    box-shadow:0 4px 12px rgba(15,23,42,.04);
    min-height:190px;
    display:grid;
    grid-template-rows:auto minmax(0,1fr);
  }
  .project-block.active{
    box-shadow:0 0 0 3px rgba(22,163,74,.14), 0 8px 18px rgba(15,23,42,.06);
    border-color:#98d7af;
  }
  .project-block-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:7px 10px;
    background:linear-gradient(180deg,#f8fafc 0%,#eef3f8 100%);
    border-bottom:1px solid #d9e1ea;
    cursor:pointer;
  }
  .project-block-title strong{
    font-size:12px;
    color:#111827;
  }
  .project-block-title span{
    color:#667085;
    font-size:11px;
    font-weight:800;
  }
  .project-block-title .badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:48px;
    border-radius:999px;
    padding:4px 8px;
    background:#ecfdf3;
    color:#14833b;
    font-size:10px;
    font-weight:950;
  }
  .project-block:not(.active) .project-block-title .badge{
    background:#eef2f7;
    color:#667085;
  }
  .project-block .table-zone{
    border-right:0;
    overflow:visible;
  }
  .project-block table{
    min-width:var(--sheetMin);
    margin:0;
  }

  .sheet-layout{
    display:grid;
    grid-template-columns:minmax(0, 1fr) minmax(0, 1fr);
    gap:8px;
    min-height:0;
    height:100%;
  }
  .table-zone{
    overflow:auto;
    min-width:0;
    min-height:0;
    border-right:1px solid #d9e1ea;
  }
  .side-progress{
    display:grid;
    grid-template-columns:repeat(3, minmax(0, 1fr));
    grid-auto-rows:auto;
    gap:8px;
    align-content:start;
    padding:8px;
    background:linear-gradient(180deg, #f8fafc 0%, #eef3f8 100%);
    border-left:1px solid #d9e1ea;
    min-width:0;
  }
  .side-progress::before{
    content:attr(data-title);
    display:flex;
    align-items:center;
    justify-content:center;
    height:40px;
    border-radius:10px;
    background:linear-gradient(180deg, #565d68 0%, #343b45 100%);
    color:#fff;
    font-size:16px;
    font-weight:950;
    letter-spacing:.12em;

function safeGetItem(key){
  try{
    return window.localStorage ? window.localStorage.getItem(key) : null;
  }catch(e){
    return null;
  }
}

function safeSetItem(key, value){
  try{
    if(window.localStorage) window.localStorage.setItem(key, value);
    return true;
  }catch(e){
    return false;
  }
}

function safeRemoveItem(key){
  try{
    if(window.localStorage) window.localStorage.removeItem(key);
    return true;
  }catch(e){
    return false;
  }
}

let state = loadState();

let selectedIndex = null;

const UNDO_LIMIT = 30;
let undoStack = [];
let isUndoRestoring = false;
let lastCommittedStateJson = "";

function snapshotStateJson(){
  state.selectedProjectIndex = selectedProjectIndex;
  state.collapsedWorks = state.collapsedWorks || {};
  state.collapsedEpisodes = state.collapsedEpisodes || {};
  return JSON.stringify(state);
}

function updateUndoButton(){
  const btn = document.getElementById("undoBtn");
  if(!btn) return;
  btn.disabled = undoStack.length === 0;
  btn.title = `${t("undo")} (Ctrl+Z)`;
}

function markHistoryCommitted(){
  lastCommittedStateJson = snapshotStateJson();
  updateUndoButton();
}

function undoLastChange(){
  if(saveTimer){
    clearTimeout(saveTimer);
    saveTimer = null;
    saveState();
  }

  if(!undoStack.length) return;

  const previousJson = undoStack.pop();
  try{
    isUndoRestoring = true;
    state = normalizeState(JSON.parse(previousJson));
    selectedProjectIndex = state.selectedProjectIndex || 0;
    selectedIndex = null;
    selectedCutKeys = new Set();
    selectionAnchorCut = null;
    selectedCells = new Set();
    selectionAnchor = null;
    clearSelectionDomCache();
    saveState();
    renderTable();
  }catch(err){
    console.warn("Undo failed", err);
  }finally{
    isUndoRestoring = false;
    updateUndoButton();
  }
}

function currentProject(){
  if(!state.projects.length){
    state.projects.push(makeProject("", "", blankCuts(10), ""));
    selectedProjectIndex = 0;
  }
  if(selectedProjectIndex < 0 || selectedProjectIndex >= state.projects.length){
    selectedProjectIndex = 0;
  }
  return state.projects[selectedProjectIndex];
}

function normalizeState(parsed){
  if(parsed && Array.isArray(parsed.projects)){
    parsed.projects.forEach(p => {
      p.id = p.id || ("p_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,7));
      p.projectName = p.projectName ?? "Untitled";
      p.episodeNo = p.episodeNo ?? "";
      p.deadlineDate = p.deadlineDate ?? "";
      p.loDeadlineDate = p.loDeadlineDate ?? p.deadlineDate ?? "";
      p.gengaDeadlineDate = p.gengaDeadlineDate ?? p.deadlineDate ?? "";
      p.cuts = Array.isArray(p.cuts) ? p.cuts : [];
    });
    parsed.selectedProjectIndex = parsed.selectedProjectIndex ?? 0;
    parsed.collapsedWorks = parsed.collapsedWorks && typeof parsed.collapsedWorks === "object" ? parsed.collapsedWorks : {};
    parsed.collapsedEpisodes = parsed.collapsedEpisodes && typeof parsed.collapsedEpisodes === "object" ? parsed.collapsedEpisodes : {};
    return parsed;
  }

  if(parsed && Array.isArray(parsed.cuts)){
    return {
      selectedProjectIndex:0,
      collapsedWorks:{},
      collapsedEpisodes:{},
      projects:[makeProject(parsed.projectName || "", parsed.episodeNo || "", parsed.cuts, parsed.deadlineDate || "")]
    };
  }

  return {
    selectedProjectIndex:0,
    collapsedWorks:{},
    collapsedEpisodes:{},
    projects:[makeProject("", "", defaultCuts, "")]
  };
}

function loadState(){
  const saved = safeGetItem(STORAGE_KEY);
  if(saved){
    try { return normalizeState(JSON.parse(saved)); } catch(e) {}
  }

  const oldSaved = safeGetItem(OLD_STORAGE_KEY);
  if(oldSaved){
    try { return normalizeState(JSON.parse(oldSaved)); } catch(e) {}
  }

  return normalizeState(null);
}

function saveState(){
  state.selectedProjectIndex = selectedProjectIndex;
  state.collapsedWorks = state.collapsedWorks || {};
  state.collapsedEpisodes = state.collapsedEpisodes || {};

  const currentJson = JSON.stringify(state);

  if(isUndoRestoring){
    lastCommittedStateJson = currentJson;
  }else if(!lastCommittedStateJson){
    lastCommittedStateJson = currentJson;
  }else if(currentJson !== lastCommittedStateJson){
    undoStack.push(lastCommittedStateJson);
    if(undoStack.length > UNDO_LIMIT) undoStack.shift();
    lastCommittedStateJson = currentJson;
  }

  safeSetItem(STORAGE_KEY, currentJson);
  updateUndoButton();
}

function normalizeWorkName(name){
  return String(name || "Untitled").trim() || "Untitled";
}

function groupedProjects(){
  const groups = [];
  const map = new Map();

  state.projects.forEach((project, index) => {
    const key = normalizeWorkName(project.projectName);
    if(!map.has(key)){
      const group = {name:key, items:[]};
      map.set(key, group);
      groups.push(group);
    }
    map.get(key).items.push({project, index});
  });

  return groups;
}

function workCollapseKey(name){
  return normalizeWorkName(name);
}

function episodeCollapseKey(project, index){
  if(!project.id){
    project.id = "p_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,7);
  }
  return project.id || `episode_${index}`;
}

function isWorkCollapsed(name){
  state.collapsedWorks = state.collapsedWorks || {};
  return Boolean(state.collapsedWorks[workCollapseKey(name)]);
}

function isEpisodeCollapsed(project, index){
  state.collapsedEpisodes = state.collapsedEpisodes || {};
  return Boolean(state.collapsedEpisodes[episodeCollapseKey(project, index)]);
}

function setWorkCollapsed(name, collapsed){
  state.collapsedWorks = state.collapsedWorks || {};
  const key = workCollapseKey(name);
  if(collapsed) state.collapsedWorks[key] = true;
  else delete state.collapsedWorks[key];
}

function setEpisodeCollapsed(project, index, collapsed){
  state.collapsedEpisodes = state.collapsedEpisodes || {};
  const key = episodeCollapseKey(project, index);
  if(collapsed) state.collapsedEpisodes[key] = true;
  else delete state.collapsedEpisodes[key];
}

function reorderWorkGroups(fromKey, toKey, placeAfter=false){
  if(!fromKey || !toKey || fromKey === toKey) return false;

  const selectedId = currentProject()?.id;
  const groups = groupedProjects();
  const fromIndex = groups.findIndex(group => workCollapseKey(group.name) === fromKey);
  const toIndex = groups.findIndex(group => workCollapseKey(group.name) === toKey);
  if(fromIndex < 0 || toIndex < 0) return false;

  const [moved] = groups.splice(fromIndex, 1);
  let insertIndex = groups.findIndex(group => workCollapseKey(group.name) === toKey);
  if(insertIndex < 0) insertIndex = groups.length;
  if(placeAfter) insertIndex += 1;

  groups.splice(insertIndex, 0, moved);
  state.projects = groups.flatMap(group => group.items.map(item => item.project));

  const nextSelected = state.projects.findIndex(project => project.id === selectedId);
  selectedProjectIndex = nextSelected >= 0 ? nextSelected : 0;
  selectedIndex = null;
  selectedCells = new Set();
  selectionAnchor = null;
  return true;
}

}

function getProjectCounts(project){
  const oldSelectedProjectIndex = selectedProjectIndex;
  const idx = state.projects.indexOf(project);
  selectedProjectIndex = idx >= 0 ? idx : oldSelectedProjectIndex;
  const counts = getCounts();
  selectedProjectIndex = oldSelectedProjectIndex;
  return counts;
}

function timeToFrames(t){
  if(!t) return 0;
  const parts = String(t).split("+").map(x => parseInt(x.trim(),10));
  const sec = isNaN(parts[0]) ? 0 : parts[0];
  const frames = isNaN(parts[1]) ? 0 : parts[1];
  return sec * 24 + frames;
}

function framesToTime(frames){
  const sec = Math.floor(frames / 24);
  const f = frames % 24;
  return sec + "+" + f;
}

function hasCutNumber(c){
  return String(c.cut ?? "").trim() !== "";
}

function clearWorkForEmptyCut(c){
  c.work = c.work || {};
  c.work.loState = "";
  c.work.gengaState = "";
  c.work.lo = false;
  c.work.genga = false;
  c.work.nigen = false;
  c.work.retake = false;
  c.status = "";
  return c;
}


function normalizeStageState(value, fallbackDone=false){
  if(["progress","done","nigen"].includes(value)) return value;
  return fallbackDone ? "done" : "";
}

function normalizeCutWork(c){
  c.work = c.work || {};

  if(!hasCutNumber(c)){
    return clearWorkForEmptyCut(c);
  }

  c.work.retake = Boolean(c.work.retake);

  const hasLoState = Object.prototype.hasOwnProperty.call(c.work, "loState");
  const hasGengaState = Object.prototype.hasOwnProperty.call(c.work, "gengaState");

  // 기존 저장 데이터는 boolean 값을 done으로 변환하되,
  // 사용자가 완료 표시를 다시 비웠을 때는 빈 상태가 유지되도록 한다.
  c.work.loState = normalizeStageState(c.work.loState, !hasLoState && Boolean(c.work.lo));
  c.work.gengaState = normalizeStageState(c.work.gengaState, !hasGengaState && Boolean(c.work.genga));

  c.work.lo = c.work.loState === "done";
  c.work.genga = c.work.gengaState === "done";
  c.work.nigen = c.work.gengaState === "nigen";
  return c;
}

function stageCellClass(state){
  if(state === "done") return "state-done";
  if(state === "progress") return "state-progress";
  if(state === "nigen") return "state-nigen";
  return "";
}

function cycleStageState(state, allowNigen=false){
  if(state === "progress") return "done";
  if(state === "done") return allowNigen ? "nigen" : "";
  if(state === "nigen") return "";
  return "progress";
}

function getRowStageClass(c){
  normalizeCutWork(c);
  if(c.work.gengaState === "done") return "row-stage-genga";
  if(c.work.gengaState === "nigen") return "row-stage-nigen";
  if(c.work.gengaState === "progress" || c.work.loState === "progress" || c.work.retake) return "row-stage-progress";
  if(c.work.loState === "done") return "row-stage-lo";
  return "";
}

function updateStatusFromWork(c){
  normalizeCutWork(c);
  if(c.work.gengaState === "nigen") c.status = "二原";
  else if(c.work.gengaState === "done") c.status = t("genga");
  else if(c.work.gengaState === "progress") c.status = `${t("genga")} ${t("stageProgress")}`;
  else if(c.work.retake) c.status = t("retake");
  else if(c.work.loState === "done") c.status = "LO";
  else if(c.work.loState === "progress") c.status = `LO ${t("stageProgress")}`;
  else c.status = "";
  return c;
}

let stageMenuTarget = null;

function applyStageChoiceToCut(key, cut, choice){
  normalizeCutWork(cut);
  const next = choice || "";

  if(key === "lo"){
    cut.work.loState = next === "nigen" ? "" : next;
    cut.work.lo = cut.work.loState === "done";
  } else if(key === "genga"){
    cut.work.gengaState = next;
    cut.work.genga = cut.work.gengaState === "done";
    cut.work.nigen = cut.work.gengaState === "nigen";
  }

  normalizeCutWork(cut);
  updateStatusFromWork(cut);
}

function getCounts(){
  const project = currentProject();
  let total = 0;
  let lo = 0;
  let retake = 0;
  let genga = 0;
  let totalFrames = 0;
  let complete = 0;

  for(const cut of project.cuts){
    normalizeCutWork(cut);
    if(!hasCutNumber(cut)) continue;

    total += 1;
    if(cut.work.loState === "done") lo += 1;
    if(cut.work.retake) retake += 1;
    if(cut.work.gengaState === "done" || cut.work.gengaState === "nigen"){
      genga += 1;
      complete += 1;
    }
    totalFrames += timeToFrames(cut.time);
  }

  return {
    total,
    lo,
    retake,
    genga,
    totalFrames,
    complete,
    remaining:Math.max(total - complete, 0),
    stageRemaining:{
      lo:Math.max(total - lo, 0),
      retake:Math.max(total - retake, 0),
      genga:Math.max(total - genga, 0)
    }
  };
}
function isAlert(c){
  normalizeCutWork(c);
  if(!c.deadline || c.work.gengaState === "done" || c.work.gengaState === "nigen") return false;
  const today = new Date();
  today.setHours(0,0,0,0);
  const d = new Date(c.deadline + "T00:00:00");
  const diffDays = Math.ceil((d - today) / 86400000);
  return diffDays <= 2;
}

function progressClass(done, total){
  const ratio = total ? done / total : 0;
  if(ratio >= .75) return "ok";
  if(ratio >= .35) return "mid";
  return "warn";
}

function formatDailyCuts(value){
  if(value === null || value === undefined || value === "" || Number.isNaN(Number(value))) return "-";
  const n = Number(value);
  return String(Math.ceil(n));
}

function formatDday(diff){
  if(diff === null || diff === undefined || Number.isNaN(diff)) return "-";
  if(diff === 0) return "D-Day";
  if(diff > 0) return `D-${diff}`;
  return `D+${Math.abs(diff)}`;
}

function getDeadlineStats(counts=getCounts()){
  const project = currentProject();
  const legacyDeadline = project.deadlineDate ?? "";
  const loDeadline = project.loDeadlineDate ?? legacyDeadline ?? "";
  const gengaDeadline = project.gengaDeadlineDate ?? legacyDeadline ?? "";
  const today = new Date();
  today.setHours(0,0,0,0);

  const loRemaining = counts.stageRemaining.lo;
  const gengaRemaining = counts.stageRemaining.genga;
  const deadlineRemaining = loRemaining + gengaRemaining; // Check/戻し is intentionally excluded.

  function buildStageStat(key, label, done, remaining, deadline){
    const percent = counts.total ? Math.round((done / counts.total) * 100) : 0;
    const stat = {
      key,
      label,
      done,
      remaining,
      percent,
      deadline:deadline || "",
      hasDeadline:Boolean(deadline),
      dDay:null,
      dDayLabel:"-",
      daysLeft:null,
      dailyCuts:null
    };

    if(!deadline){
      return stat;
    }

    const d = new Date(deadline + "T00:00:00");
    const diff = Math.ceil((d - today) / 86400000);
    const daysLeft = Math.max(diff + 1, 0); // includes today
    stat.dDay = diff;
    stat.dDayLabel = formatDday(diff);
    stat.daysLeft = daysLeft;
    stat.dailyCuts = daysLeft > 0 ? remaining / daysLeft : remaining;
    return stat;
  }

  const stageStats = [
    buildStageStat("lo", "LO", counts.lo, loRemaining, loDeadline),
    buildStageStat("genga", t("genga"), counts.genga, gengaRemaining, gengaDeadline)
  ];

  const hasDeadline = stageStats.some(stage => stage.hasDeadline);
  const loStage = stageStats[0];
  const gengaStage = stageStats[1];

  let status = t("noDeadlineStatus");
  if(hasDeadline){
    if(deadlineRemaining === 0){
      status = t("allDone");
    } else {
      const loText = loStage.hasDeadline
        ? `LO ${loStage.dDayLabel} · ${formatDailyCuts(loStage.dailyCuts)}${t("cutsPerDay")}`
        : `LO ${t("deadlineUnset")}`;
      const gengaText = gengaStage.hasDeadline
        ? `${t("genga")} ${gengaStage.dDayLabel} · ${formatDailyCuts(gengaStage.dailyCuts)}${t("cutsPerDay")}`
        : `${t("genga")} ${t("deadlineUnset")}`;
      status = `${loText} / ${gengaText}`;
    }
  }

  return {
    hasDeadline,
    deadline:"",
    loDeadline,
    gengaDeadline,
    dDay:null,
    dDayLabel:hasDeadline ? `LO ${loStage.dDayLabel} / ${t("genga")} ${gengaStage.dDayLabel}` : "-",
    daysLeft:null,
    dailyCuts:null,
    dailyWorkUnits:null,
    remaining:deadlineRemaining,
    progressPercent:counts.total ? Math.round((counts.complete / counts.total) * 100) : 0,
    stageStats,
    status
  };
}

function placeCaretAtEnd(el){

  const range = document.createRange();
  range.selectNodeContents(el);
  range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function updateCellValueFromDom(td){
  if(!td) return;
  const field = td.dataset.field;
  const value = td.textContent.trim();
  const tr = td.closest("tr");

  if(field === "projectName"){
    const pidx = Number(td.dataset.projectIndex ?? selectedProjectIndex);
    const indexes = td.dataset.groupIndexes
      ? td.dataset.groupIndexes.split(",").map(Number).filter(n => !Number.isNaN(n))
      : [pidx];
    indexes.forEach(idx => {
      if(state.projects[idx]) state.projects[idx].projectName = value;
    });
    selectedProjectIndex = pidx;
  } else if(field === "episodeNo"){
    const pidx = Number(td.dataset.projectIndex ?? selectedProjectIndex);
    if(state.projects[pidx]) state.projects[pidx].episodeNo = value;
    selectedProjectIndex = pidx;
  } else if(["cut","time"].includes(field)){
    const pidx = Number(td.dataset.projectIndex ?? tr?.dataset.projectIndex ?? selectedProjectIndex);
    const idx = Number(td.dataset.cutIndex ?? tr?.dataset.index);
    if(!Number.isNaN(pidx)) selectedProjectIndex = pidx;
    if(!Number.isNaN(idx) && currentProject().cuts[idx]){
      const cut = currentProject().cuts[idx];
      cut[field] = value;
      if(field === "cut" && !hasCutNumber(cut)){
        clearWorkForEmptyCut(cut);
      }
    }
  }
}

function selectRowMarker(marker, mode="single"){
  const projectIndex = Number(marker.dataset.projectIndex);
  const cutIndex = Number(marker.dataset.cutClick);
  if(Number.isNaN(projectIndex) || Number.isNaN(cutIndex)) return;

  const previousProjectIndex = selectedProjectIndex;
  selectedProjectIndex = projectIndex;
  selectedIndex = cutIndex;

  if(mode === "range" && selectionAnchorCut && selectionAnchorCut.projectIndex === projectIndex){
    const startIndex = Math.min(selectionAnchorCut.cutIndex, cutIndex);
    const endIndex = Math.max(selectionAnchorCut.cutIndex, cutIndex);
    selectedCutKeys = new Set();

    for(let i=startIndex; i<=endIndex; i++){
      if(state.projects[projectIndex]?.cuts[i]){
        selectedCutKeys.add(cutKey(projectIndex, i));
      }
    }
  } else {
    selectedCutKeys = new Set([cutKey(projectIndex, cutIndex)]);
    selectionAnchorCut = {projectIndex, cutIndex};

    const firstCell = marker.closest("tr")?.querySelector(".selectable-cell");
    if(firstCell){
      selectionAnchor = getCellCoords(firstCell);
    } else {
      selectionAnchor = null;
    }
  }

  selectedCells = new Set();
  applySelectionClasses();
  syncCurrentControlsLight(previousProjectIndex !== selectedProjectIndex);
}


function handleCutRowSingleClick(projectIndex, cutIndex, event=null){
  const marker = event?.target?.closest?.("[data-cut-click]");
  if(!marker) return;

  if(event?.altKey && selectedIndex !== null && selectedProjectIndex === Number(projectIndex) && selectedIndex !== Number(cutIndex)){
    reorderCutRow(Number(projectIndex), selectedIndex, Number(cutIndex), false);
    return;
  }

  if(event?.shiftKey){
    selectRowMarker(marker, "range");
  } else {
    selectRowMarker(marker, "single");
  }
}

function handleCutRowDoubleClick(projectIndex, cutIndex){
  if(cutClickTimer){
    clearTimeout(cutClickTimer);
    cutClickTimer = null;
  }
  insertCutAfter(Number(projectIndex), Number(cutIndex));
}

function insertCutAfter(projectIndex, cutIndex){
  const project = state.projects[projectIndex];
  if(!project) return;
  const safeIndex = Math.max(-1, Math.min(Number(cutIndex), project.cuts.length - 1));
  project.cuts.splice(safeIndex + 1, 0, blankCut());
  selectedProjectIndex = projectIndex;
  selectedIndex = safeIndex + 1;
  selectedCutKeys = new Set([cutKey(projectIndex, selectedIndex)]);
  selectionAnchorCut = {projectIndex, cutIndex:selectedIndex};
  selectedCells = new Set();
  selectionAnchor = null;
  saveState();
  renderTable();
}

function reorderCutRow(projectIndex, fromIndex, toIndex, placeAfter){
  const project = state.projects[projectIndex];
  if(!project) return false;

  fromIndex = Number(fromIndex);
  toIndex = Number(toIndex);
  if(Number.isNaN(fromIndex) || Number.isNaN(toIndex)) return false;
  if(fromIndex < 0 || fromIndex >= project.cuts.length) return false;
  if(toIndex < 0 || toIndex >= project.cuts.length) return false;
  if(fromIndex === toIndex) return false;

  const [moved] = project.cuts.splice(fromIndex, 1);
  let insertIndex = toIndex + (placeAfter ? 1 : 0);

  if(fromIndex < insertIndex) insertIndex -= 1;
  insertIndex = Math.max(0, Math.min(insertIndex, project.cuts.length));

  project.cuts.splice(insertIndex, 0, moved);
  selectedProjectIndex = projectIndex;
  selectedIndex = insertIndex;
  selectedCutKeys = new Set([cutKey(projectIndex, insertIndex)]);
  selectionAnchorCut = {projectIndex, cutIndex:insertIndex};
  selectedCells = new Set();
  selectionAnchor = null;
  saveState();
  renderTable();
  return true;
}


function refreshWorkRowDom(projectIndex, cutIndex, options={}){
  const tr = document.querySelector(`#tbody tr[data-project-index="${projectIndex}"][data-index="${cutIndex}"]`);
  const cut = state.projects[projectIndex]?.cuts[cutIndex];
  if(!tr || !cut) return false;

  normalizeCutWork(cut);

  tr.classList.remove(
    "row-stage-lo",
    "row-stage-check",
    "row-stage-progress",
    "row-stage-genga",
    "row-stage-nigen"
  );

  const rowStage = getRowStageClass(cut);
  if(rowStage) tr.classList.add(rowStage);

  tr.classList.toggle("cut-row-selected", getEffectiveSelectedCutKeys().has(cutKey(projectIndex, cutIndex)));

  tr.querySelectorAll(".work-cell[data-work]").forEach(cell => {
    const key = cell.dataset.work;

    cell.classList.toggle("work-disabled", !hasCutNumber(cut));

    cell.classList.remove("state-done", "state-progress", "state-nigen", "check-done");

    if(key === "lo"){
      const cls = stageCellClass(cut.work.loState);
      if(cls) cell.classList.add(cls);
    } else if(key === "genga"){
      const cls = stageCellClass(cut.work.gengaState);
      if(cls) cell.classList.add(cls);
    } else if(key === "retake" && cut.work.retake){
      cell.classList.add("check-done");
    }
  });

  updateEpisodeTotalTimeDisplay(projectIndex);
  if(options.progress !== false) scheduleProgressBoard(30);
  return true;
}

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g, s => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[s]));
}

let selectedCells = new Set();
let selectedCutKeys = new Set();
let selectionAnchor = null;
let selectionAnchorCut = null;
let isShiftDragging = false;
let selectionDomCache = [];
let selectionRowDomCache = [];

function cellKey(row, col){
  return `${row}:${col}`;
}

function cutKey(projectIndex, cutIndex){
  return `${projectIndex}:${cutIndex}`;
}

function parseCutKey(key){
  const [projectIndex, cutIndex] = String(key).split(":").map(Number);
  return {projectIndex, cutIndex};
}

function getCellCoords(cell){
  return {
    row:Number(cell.dataset.row),
    col:Number(cell.dataset.col)
  };
}

function clearSelectionDomCache(){
  selectionDomCache.forEach(cell => {
    if(!cell) return;
    cell.classList.remove(
      "selected-cell",
      "selected-range",
      "range-edge-top",
      "range-edge-bottom",
      "range-edge-left",
      "range-edge-right"
    );
  });
  selectionDomCache = [];

  selectionRowDomCache.forEach(row => {
    if(row) row.classList.remove("cut-row-selected");
  });
  selectionRowDomCache = [];
}

function setSingleCellSelection(cell){
  const {row, col} = getCellCoords(cell);
  selectedCells = new Set([cellKey(row, col)]);
  selectionAnchor = {row, col};

  const tr = cell.closest("tr[data-project-index][data-index]");
  if(tr && tr.dataset.index !== ""){
    selectedProjectIndex = Number(tr.dataset.projectIndex);
    selectedIndex = Number(tr.dataset.index);
    selectedCutKeys = new Set([cutKey(selectedProjectIndex, selectedIndex)]);
    selectionAnchorCut = {projectIndex:selectedProjectIndex, cutIndex:selectedIndex};
  } else {
    selectedCutKeys = new Set();
    selectionAnchorCut = null;
  }

  applySelectionClasses();
}

function setRangeSelection(from, to){
  const minRow = Math.min(from.row, to.row);
  const maxRow = Math.max(from.row, to.row);
  const minCol = Math.min(from.col, to.col);
  const maxCol = Math.max(from.col, to.col);

  selectedCells = new Set();
  for(let r=minRow; r<=maxRow; r++){
    for(let c=minCol; c<=maxCol; c++){
      selectedCells.add(cellKey(r, c));
    }
  }
  applySelectionClasses({minRow, maxRow, minCol, maxCol});
}

function clearCurrentSelection(){
  selectedIndex = null;
  selectedCutKeys = new Set();
  selectionAnchorCut = null;
  selectedCells = new Set();
  selectionAnchor = null;
  clearSelectionDomCache();
}

function getEffectiveSelectedCutKeys(){
  if(selectedCutKeys.size > 0) return selectedCutKeys;
  if(selectedIndex !== null && selectedIndex !== undefined && state.projects[selectedProjectIndex]?.cuts[selectedIndex]){
    return new Set([cutKey(selectedProjectIndex, selectedIndex)]);
  }
  return new Set();
}

function applySelectionClasses(range=null){
  clearSelectionDomCache();

  const touchedCells = [];
  const touchedRows = [];

  getEffectiveSelectedCutKeys().forEach(key => {
    const {projectIndex, cutIndex} = parseCutKey(key);
    if(Number.isNaN(projectIndex) || Number.isNaN(cutIndex)) return;

    const tr = document.querySelector(`#tbody tr[data-project-index="${projectIndex}"][data-index="${cutIndex}"]`);
    if(!tr) return;

    tr.classList.add("cut-row-selected");
    touchedRows.push(tr);

    tr.querySelectorAll(".selectable-cell").forEach(cell => {
      cell.classList.add("selected-cell");
      touchedCells.push(cell);
    });
  });

  selectionDomCache = touchedCells;
  selectionRowDomCache = touchedRows;
}

function buildNavigationGrid(){
  const grid = [];

  document.querySelectorAll("#tbody .work-table-wrap table").forEach(table => {
    const spans = [];
    const rows = Array.from(table.querySelectorAll("tbody tr"));

    rows.forEach(tr => {
      const slots = [];

      for(let c=0; c<8; c++){
        const span = spans[c];
        if(span && span.remaining > 0){
          slots[c] = span.cell;
          span.remaining -= 1;
          if(span.remaining <= 0) spans[c] = null;
        }
      }

      let col = 0;
      Array.from(tr.cells).forEach(cell => {
        while(slots[col]) col += 1;

        const colSpan = Math.max(1, Number(cell.colSpan || 1));
        const rowSpan = Math.max(1, Number(cell.rowSpan || 1));

        for(let dc=0; dc<colSpan; dc++){
          slots[col + dc] = cell;
          if(rowSpan > 1){
            spans[col + dc] = {cell, remaining:rowSpan - 1};
          }
        }
        col += colSpan;
      });

      grid.push(slots);
    });
  });

  return grid;
}

function getCurrentSelectedCell(){
  const active = document.activeElement;
  if(active && active.matches && active.matches("#tbody .selectable-cell")) return active;

  const selected = document.querySelector("#tbody .selected-cell");
  if(selected) return selected;

  const key = Array.from(selectedCells)[0];
  if(!key) return null;

  return Array.from(document.querySelectorAll("#tbody .selectable-cell")).find(cell => {
    const row = Number(cell.dataset.row);
    const col = Number(cell.dataset.col);
    return cellKey(row, col) === key;
  }) || null;
}

function findCellInGrid(grid, targetCell){
  for(let r=0; r<grid.length; r++){
    for(let c=0; c<8; c++){
      if(grid[r][c] === targetCell) return {row:r, col:c};
    }
  }
  return null;
}

function isNavigableCell(cell){
  return Boolean(cell && cell.classList && cell.classList.contains("selectable-cell"));
}

function closestNavigableInRow(rowSlots, preferredCol, currentCell=null){
  let best = null;
  let bestDist = Infinity;

  for(let c=0; c<8; c++){
    const cell = rowSlots[c];
    if(!isNavigableCell(cell) || cell === currentCell) continue;

    const dist = Math.abs(c - preferredCol);
    if(dist < bestDist){
      best = cell;
      bestDist = dist;
    }
  }

  return best;
}

function findArrowTarget(currentCell, arrowKey){
  const grid = buildNavigationGrid();
  const pos = findCellInGrid(grid, currentCell);
  if(!pos) return null;

  if(arrowKey === "ArrowLeft" || arrowKey === "ArrowRight"){
    const step = arrowKey === "ArrowLeft" ? -1 : 1;

    for(let c=pos.col + step; c>=0 && c<7; c += step){
      const cell = grid[pos.row][c];
      if(isNavigableCell(cell) && cell !== currentCell) return cell;
    }
    return null;
  }

  if(arrowKey === "ArrowUp" || arrowKey === "ArrowDown"){
    const step = arrowKey === "ArrowUp" ? -1 : 1;

    for(let r=pos.row + step; r>=0 && r<grid.length; r += step){
      const direct = grid[r][pos.col];
      if(isNavigableCell(direct) && direct !== currentCell) return direct;

      const nearby = closestNavigableInRow(grid[r], pos.col, currentCell);
      if(nearby) return nearby;
    }
  }

  return null;
}

function selectCellByKeyboard(cell){
  if(!cell) return;

  const tr = cell.closest("tr");
  const nextProjectIndex = Number(cell.dataset.projectIndex ?? tr?.dataset.projectIndex ?? selectedProjectIndex);
  selectedProjectIndex = Number.isNaN(nextProjectIndex) ? selectedProjectIndex : nextProjectIndex;

  selectedIndex = getIndexForCell(cell, tr);
  if(cell.dataset.cutIndex !== undefined){
    selectedIndex = Number(cell.dataset.cutIndex);
  }

  setSingleCellSelection(cell);
  refreshCurrentControls();

  if(cell.isContentEditable){
    requestAnimationFrame(() => {
      if(document.body.contains(cell)){
        cell.focus();
        placeCaretAtEnd(cell);
      }
    });
  } else {
    const active = document.activeElement;
    if(active && active.isContentEditable) active.blur();
  }

  cell.scrollIntoView({block:"nearest", inline:"nearest"});
}

function handleArrowNavigation(e){
  const arrowKeys = ["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"];
  if(!arrowKeys.includes(e.key)) return false;
  if(e.ctrlKey || e.metaKey || e.altKey) return false;
  if(e.shiftKey) return false;

  const active = document.activeElement;
  const tbody = document.getElementById("tbody");
  const isTableEditable = active && active.isContentEditable && tbody.contains(active);
  const isOutsideForm = active && ["INPUT","TEXTAREA","SELECT"].includes(active.tagName);

  if(isOutsideForm && !isTableEditable) return false;

  const menu = document.getElementById("stageMenu");
  if(menu && !menu.hidden) return false;

  const currentCell = getCurrentSelectedCell();
  if(!currentCell) return false;

  if(isTableEditable){
    updateCellValueFromDom(active);
    if(active.dataset.field === "time"){
      const projectIndex = Number(active.dataset.projectIndex ?? selectedProjectIndex);
      updateEpisodeTotalTimeDisplay(projectIndex);
    }
    scheduleSave();
  }

  const targetCell = findArrowTarget(currentCell, e.key);
  if(!targetCell) return false;

  e.preventDefault();
  selectCellByKeyboard(targetCell);
  return true;
}

document.getElementById("tbody").addEventListener("keydown", e => {
  if(handleArrowNavigation(e)) return;

  const active = document.activeElement;
  if(active && active.isContentEditable) return;
  if(e.key.length !== 1 || e.ctrlKey || e.metaKey || e.altKey) return;

  const key = Array.from(selectedCells)[0];
  if(!key) return;
  let target = null;
  for(const cell of document.querySelectorAll("#tbody .selectable-cell")){
    const row = Number(cell.dataset.row);
    const col = Number(cell.dataset.col);
    if(cellKey(row, col) === key && cell.isContentEditable){
      target = cell;
      break;
    }
  }
  if(target){
    const tr = target.closest("tr");
    selectedProjectIndex = Number(target.dataset.projectIndex ?? tr?.dataset.projectIndex ?? selectedProjectIndex);
    selectedIndex = getIndexForCell(target, tr);
    target.focus();
    placeCaretAtEnd(target);
  }
});

document.addEventListener("keydown", e => {
  handleArrowNavigation(e);
});

document.addEventListener("mouseup", () => {
  isShiftDragging = false;
});

document.addEventListener("keydown", e => {
  if(e.key === "Shift"){
    document.body.classList.add("shift-selecting");
  }
});

document.addEventListener("keyup", e => {
  if(e.key === "Shift"){
    document.body.classList.remove("shift-selecting");
    isShiftDragging = false;
  }
});

let draggedWorkKey = null;
let dragPlaceAfter = false;

document.getElementById("tbody").addEventListener("dragstart", e => {
  const header = e.target.closest(".work-group-head[data-drag-work]");
  if(!header || e.target.closest("button, input, select, [contenteditable='true']")){
    e.preventDefault();
    return;
  }

  draggedWorkKey = header.dataset.dragWork;
  const group = header.closest(".work-group");
  if(group) group.classList.add("dragging");

  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", draggedWorkKey);
});


document.addEventListener("pointerdown", e => {
  if(e.target.closest("#tbody")) return;
  if(e.target.closest("#stageMenu")) return;
  if(e.target.closest(".modal-bg")) return;
  if(e.target.closest("button, input, select, textarea, label, [contenteditable='true'], a")) return;

  if(selectedCutKeys.size || selectedCells.size || selectedIndex !== null){
    clearCurrentSelection();
    hideStageMenu();
  }
});


document.getElementById("tbody").addEventListener("dragover", e => {
  if(!draggedWorkKey) return;

  const targetGroup = e.target.closest(".work-group[data-work-key]");
  if(!targetGroup || targetGroup.dataset.workKey === draggedWorkKey) return;

  e.preventDefault();
  e.dataTransfer.dropEffect = "move";

  document.querySelectorAll("#tbody .work-group.drop-before, #tbody .work-group.drop-after").forEach(el => {
    el.classList.remove("drop-before","drop-after");
  });

  const rect = targetGroup.getBoundingClientRect();
  dragPlaceAfter = e.clientY > rect.top + rect.height / 2;
  targetGroup.classList.add(dragPlaceAfter ? "drop-after" : "drop-before");
});

document.getElementById("tbody").addEventListener("drop", e => {
  if(!draggedWorkKey) return;

  const targetGroup = e.target.closest(".work-group[data-work-key]");
  if(!targetGroup) return;

  e.preventDefault();
  const moved = reorderWorkGroups(draggedWorkKey, targetGroup.dataset.workKey, dragPlaceAfter);
  draggedWorkKey = null;
  dragPlaceAfter = false;
  clearWorkDropClasses();

  if(moved){
    saveState();
    renderTable();
  }
});

document.getElementById("tbody").addEventListener("dragend", () => {

document.getElementById("tbody").addEventListener("mousedown", e => {
  if(e.target.closest("[data-collapse-work], [data-collapse-episode], .drag-handle")) return;
  if(e.target.closest("[data-cut-click]")){
    // Row-number click has its own selection logic.
    // Prevent mousedown from resetting the Shift-selection anchor before click runs.
    return;
  }
  const cell = e.target.closest(".selectable-cell");
  const tr = e.target.closest("tr");
  if(!cell || !tr) return;

  const nextProjectIndex = Number(cell.dataset.projectIndex ?? tr.dataset.projectIndex ?? selectedProjectIndex);
  selectedProjectIndex = Number.isNaN(nextProjectIndex) ? selectedProjectIndex : nextProjectIndex;
  selectedIndex = getIndexForCell(cell, tr);

  // CUT / TIME 입력은 병합 셀이나 sticky 위치가 아니라 셀 자체의 data-cut-index를 기준으로 고정한다.
  if(cell.dataset.cutIndex !== undefined){
    selectedIndex = Number(cell.dataset.cutIndex);
  }

  isShiftDragging = false;
  setSingleCellSelection(cell);
  refreshCurrentControls();

  if(cell.isContentEditable){
    // CUT/TIME도 作品名처럼 클릭한 바로 그 셀에 포커스되게 한다.
    requestAnimationFrame(() => {
      if(document.body.contains(cell)){
        cell.focus();
        if(String(cell.textContent || "").length === 0) placeCaretAtEnd(cell);
      }
    });
  }
});

document.getElementById("tbody").addEventListener("mouseover", e => {
  // Multi-cell drag selection is disabled.
});

document.getElementById("tbody").addEventListener("click", e => {
  const tr = e.target.closest("tr");
  if(!tr) return;

  selectedProjectIndex = Number(e.target.dataset.projectIndex ?? tr.dataset.projectIndex ?? selectedProjectIndex);
  selectedIndex = e.target.dataset.cutIndex !== undefined
    ? Number(e.target.dataset.cutIndex)
    : (tr.dataset.index === "" || tr.dataset.index === undefined ? null : Number(tr.dataset.index));

  if(e.target.dataset.work && selectedIndex !== null){
    const key = e.target.dataset.work;
    const project = currentProject();
    const cut = project.cuts[selectedIndex];

    if(!hasCutNumber(cut)){
      clearWorkForEmptyCut(cut);
      if(!refreshWorkRowDom(selectedProjectIndex, selectedIndex)){
        renderTable();
      }
      return;
    }

    normalizeCutWork(cut);

    if(key === "lo"){
      cut.work.loState = cycleStageState(cut.work.loState, false);
      cut.work.lo = cut.work.loState === "done";
    } else if(key === "genga"){
      cut.work.gengaState = cycleStageState(cut.work.gengaState, true);
      cut.work.genga = cut.work.gengaState === "done";
      cut.work.nigen = cut.work.gengaState === "nigen";
    } else if(key === "retake"){
      cut.work.retake = !cut.work.retake;
    }

    normalizeCutWork(cut);
    updateStatusFromWork(cut);
    saveState();
    if(!refreshWorkRowDom(selectedProjectIndex, selectedIndex)){
      renderTable();
    }
  }
});

      renderTable();

  selectedProjectIndex = projectIndex;

document.getElementById("removeWorkBtn").addEventListener("click", () => {
  if(state.projects.length <= 1){
    alert(t("alertMinWork"));
    return;
  }

  const project = currentProject();
  const name = normalizeWorkName(project.projectName);
  const indexes = state.projects
    .map((p, idx) => ({p, idx}))
    .filter(item => normalizeWorkName(item.p.projectName) === name)
    .map(item => item.idx);

  if(confirm(t("confirmRemoveWork", name, indexes.length))){
    state.projects = state.projects.filter((_, idx) => !indexes.includes(idx));
    if(!state.projects.length) state = makeEmptyState();
    selectedProjectIndex = Math.min(selectedProjectIndex, state.projects.length - 1);
    selectedProjectIndex = Math.max(0, selectedProjectIndex);
    selectedIndex = null;
    selectedCells = new Set();
    selectionAnchor = null;
    saveState();
    renderTable();
  }
});

document.getElementById("removeEpisodeBtn").addEventListener("click", () => {

  }finally{

});

function getSelectedCutTargets(){
  const targets = [];
  const seen = new Set();

  getEffectiveSelectedCutKeys().forEach(key => {
    const {projectIndex, cutIndex} = parseCutKey(key);
    if(Number.isNaN(projectIndex) || Number.isNaN(cutIndex)) return;
    if(!state.projects[projectIndex]?.cuts[cutIndex]) return;

    const safeKey = `${projectIndex}:${cutIndex}`;
    if(!seen.has(safeKey)){
      seen.add(safeKey);
      targets.push({projectIndex, cutIndex});
    }
  });

  return targets;
}


function removeSelectedCut(){
  const targets = getSelectedCutTargets();

  if(targets.length === 0){
    alert(t("alertSelectCut"));
    return;
  }

  let label = "";
  if(targets.length === 1){
    const target = targets[0];
    const selectedCut = state.projects[target.projectIndex]?.cuts[target.cutIndex];
    label = selectedCut?.cut ? `${t("cut")} ${selectedCut.cut}` : t("emptyRowLabel", target.cutIndex + 1);
  } else {
    label = `${targets.length}${t("cut")}`;
  }

  if(confirm(t("confirmRemoveCut", label))){
    const grouped = new Map();

    targets.forEach(({projectIndex, cutIndex}) => {
      if(!grouped.has(projectIndex)) grouped.set(projectIndex, []);
      grouped.get(projectIndex).push(cutIndex);
    });

    grouped.forEach((indexes, projectIndex) => {
      const project = state.projects[projectIndex];
      if(!project) return;

      [...new Set(indexes)]
        .sort((a,b) => b - a)
        .forEach(index => {
          if(index >= 0 && index < project.cuts.length){
            project.cuts.splice(index, 1);
          }
        });
    });

    selectedIndex = null;
    selectedCells = new Set();
    selectionAnchor = null;
    saveState();
    renderTable();
  }
}
